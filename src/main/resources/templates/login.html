<!DOCTYPE html>
<!--
    xmlns:th → Habilita el dialecto de Thymeleaf para procesar atributos th:*
    Spring Security desactiva th:action automáticamente si no se usa el namespace de security.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Ventro Resto</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           Variables y Reset general
        ============================================ */
        :root {
            --primary:       #2AB6A1;
            --primary-dark:  #1E8E7C;
            --secondary:     #1E2235;
            --dark-bg:       #0B0D13;
            --card-bg:       #141721;
            --border:        rgba(255,255,255,0.06);
            --text-muted:    rgba(255,255,255,0.4);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Fondo con gradiente animado */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 80% at 20% 20%, rgba(42,182,161,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 60% at 80% 80%, rgba(30,34,53,0.3) 0%, transparent 60%);
            animation: pulso 8s ease-in-out infinite alternate;
        }

        @keyframes pulso {
            from { opacity: 0.6; transform: scale(1); }
            to   { opacity: 1;   transform: scale(1.05); }
        }

        /* ============================================
           Tarjeta de Login (Glassmorphism)
        ============================================ */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: rgba(26, 29, 46, 0.85);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(42,182,161,0.1),
                0 32px 80px rgba(0,0,0,0.7);
            animation: aparecer 0.6s ease-out both;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Logo / Icono */
        .login-logo-container {
            text-center;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
        }
        .login-logo-container .snapshot-wordmark {
            display: grid;
            place-items: center;
            width: 5rem;
            height: 5rem;
            border: 1px solid rgba(42,182,161,0.45);
            border-radius: 1.25rem;
            color: #2AB6A1;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }
        .snapshot-wordmark-footer {
            color: rgba(255,255,255,0.55);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .login-titulo {
            color: #fff;
            font-size: 1.65rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.35rem;
        }

        .login-subtitulo {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        /* Campos de formulario */
        .form-label {
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
        }

        .form-control {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.1);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(42,182,161,0.2);
            color: #fff;
        }

        .form-control::placeholder { color: rgba(255,255,255,0.25); }

        .input-group-text {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-right: none;
            border-radius: 12px 0 0 12px;
            color: var(--text-muted);
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 12px 12px 0;
        }

        /* Botón principal */
        .btn-login {
            width: 100%;
            padding: 0.85rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 20px rgba(42,182,161,0.4);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(42,182,161,0.55);
        }

        .btn-login:active { transform: translateY(0); }

        /* Alertas de error/éxito */
        .alerta-error, .alerta-logout {
            border-radius: 12px;
            font-size: 0.88rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            border: none;
        }

        .alerta-error  { background: rgba(220,53,69,0.2);  color: #ff9ca6; }
        .alerta-logout { background: rgba(25,135,84,0.2);  color: #6ee7b4; }

        .footer-text {
            text-align: center;
            margin-top: 1.75rem;
            color: var(--text-muted);
            font-size: 0.78rem;
        }
    </style>
</head>
<body>

<div class="login-card">

    <!-- Logo de la app -->
    <div class="login-logo-container">
        <span class="snapshot-wordmark" aria-label="Ventro Resto">VR</span>
    </div>

    <h1 class="login-titulo">Ventro Resto</h1>
    <p class="login-subtitulo">Sistema de Gestión para Restaurantes</p>

    <!--
        th:if → Renderiza el bloque solo si la condición es verdadera.
        param.error y param.logout son parámetros de URL que Spring Security
        agrega automáticamente en /login?error=true y /login?logout=true.
    -->
    <div th:if="${param.error}" class="alerta-error">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        Usuario o contraseña incorrectos. Inténtalo de nuevo.
    </div>

    <div th:if="${param.logout}" class="alerta-logout">
        <i class="bi bi-check-circle-fill me-2"></i>
        Has cerrado sesión correctamente.
    </div>

    <!--
        th:action="@{/login}" → Thymeleaf genera la URL correcta y agrega
        automáticamente el token CSRF requerido por Spring Security.
        method="post" → Spring Security solo acepta POST para el login.
    -->
    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <!--
                    name="username" y name="password" son los nombres que
                    Spring Security espera por defecto. No cambiar.
                -->
                <input type="text"
                       id="username"
                       name="username"
                       class="form-control"
                       placeholder="Tu nombre de usuario"
                       autocomplete="username"
                       required>
            </div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Tu contraseña"
                       autocomplete="current-password"
                       required>
            </div>
        </div>

        <button type="submit" class="btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
        </button>

    </form>

    <div class="footer-text d-flex flex-column align-items-center gap-2">
        <span>&copy; 2026 Ventro Resto &mdash; Sistema Interno</span>
        <div>
            <span style="font-size: 0.65rem; color: rgba(255,255,255,0.3); display:block; margin-bottom: 2px;">POWERED BY</span>
            <span class="snapshot-wordmark-footer">VENTRO</span>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
