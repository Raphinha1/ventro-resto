<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menú Digital | Ventro</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --primary: #2AB6A1;
            --primary-dark: #229c89;
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --danger: #f85149;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 80px; /* Space for bottom nav if needed */
        }

        /* --- Header --- */
        .menu-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem;
            text-align: center;
        }

        .menu-header .snapshot-wordmark {
            display: inline-block;
            color: var(--primary);
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.12em;
        }

        .menu-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 0.5rem;
            color: var(--primary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* --- Category Navigation (Horizontal Scroll) --- */
        .category-nav {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 1rem;
            scrollbar-width: none; /* Firefox */
        }
        .category-nav::-webkit-scrollbar {
            display: none; /* Safari and Chrome */
        }

        .cat-pill {
            white-space: nowrap;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .cat-pill.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(42, 182, 161, 0.3);
        }

        /* --- Product List --- */
        .category-section {
            padding: 1rem;
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(42, 182, 161, 0.2);
            color: #fff;
        }

        .product-card {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 1rem;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-img-container {
            width: 110px;
            height: 110px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.02);
            position: relative;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: rgba(255, 255, 255, 0.1);
        }

        .product-details {
            padding: 0.8rem 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .product-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.2rem;
            line-height: 1.2;
        }

        .product-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .product-price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary);
        }

        /* --- Out of stock styling --- */
        .product-card.sold-out {
            opacity: 0.6;
            filter: grayscale(80%);
        }

        .sold-out-badge {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(248, 81, 73, 0.9);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.1rem 0.5rem;
            border-radius: 10px;
            letter-spacing: 0.05em;
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }

        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
        
        .empty-menu {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header class="menu-header">
        <span class="snapshot-wordmark" aria-label="Ventro">VENTRO</span>
        <div class="menu-title">Nuestro Menú</div>
    </header>

    <div th:if="${#maps.isEmpty(productosPorCategoria)}" class="empty-menu">
        <i class="bi bi-emoji-frown fs-1 mb-3 text-secondary"></i>
        <h4>Menú no disponible</h4>
        <p>Actualmente no hay productos configurados en el menú digital.</p>
    </div>

    <div th:if="${not #maps.isEmpty(productosPorCategoria)}">
        <!-- Sticky Navigation -->
        <nav class="category-nav" id="categoryNav">
            <a th:each="entry, stat : ${productosPorCategoria}" 
               th:href="'#cat-' + ${stat.index}" 
               class="cat-pill" 
               th:classappend="${stat.index == 0} ? 'active' : ''"
               th:text="${entry.key}"
               onclick="setActiveCategory(this)">Categoría</a>
        </nav>

        <!-- Product Sections -->
        <div class="menu-content">
            <section th:each="entry, stat : ${productosPorCategoria}" 
                     th:id="'cat-' + ${stat.index}" 
                     class="category-section">
                
                <h2 class="category-title" th:text="${entry.key}">Categoría</h2>

                <div class="row">
                    <div th:each="producto : ${entry.value}" 
                         class="col-12 col-md-6 col-lg-4">
                        
                        <!-- Verificamos la disponibilidad en el mapa -->
                        <div class="product-card" th:classappend="${!disponibilidad[producto.id]} ? 'sold-out' : ''">
                            
                            <div class="product-img-container">
                                <img th:if="${producto.imagenUrl != null and !#strings.isEmpty(producto.imagenUrl)}" 
                                     th:src="@{${producto.imagenUrl}}" 
                                     class="product-img" alt="Imagen">
                                
                                <div th:if="${producto.imagenUrl == null or #strings.isEmpty(producto.imagenUrl)}" 
                                     class="product-placeholder">
                                    <i class="bi bi-image"></i>
                                </div>

                                <span th:if="${!disponibilidad[producto.id]}" class="sold-out-badge">AGOTADO</span>
                            </div>

                            <div class="product-details">
                                <div>
                                    <div class="product-name" th:text="${producto.nombre}">Nombre del Producto</div>
                                    <div class="product-desc" th:if="${!#strings.isEmpty(producto.descripcion)}" th:text="${producto.descripcion}">
                                        Descripción breve del producto...
                                    </div>
                                </div>
                                
                                <div class="product-price-row">
                                    <div class="product-price" th:text="'$' + ${#numbers.formatDecimal(producto.precioVenta, 1, 'COMMA', 2, 'POINT')}">
                                        $0.00
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </section>
        </div>
    </div>

    <!-- Bootstrap JS (optional for some components, but keeping it light) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Simple logic to highlight active category pill
        function setActiveCategory(element) {
            document.querySelectorAll('.cat-pill').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            // Scroll nav to keep element in view
            element.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        // Intersection Observer to update active pill on scroll
        document.addEventListener('DOMContentLoaded', () => {
            const sections = document.querySelectorAll('.category-section');
            const navLinks = document.querySelectorAll('.cat-pill');

            const observerOptions = {
                root: null,
                rootMargin: '-20% 0px -80% 0px', // Trigger slightly below header
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.getAttribute('id');
                        const correspondingLink = document.querySelector(`.cat-pill[href="#${id}"]`);
                        if (correspondingLink) {
                            setActiveCategory(correspondingLink);
                        }
                    }
                });
            }, observerOptions);

            sections.forEach(section => {
                observer.observe(section);
            });
        });
    </script>
</body>
</html>
