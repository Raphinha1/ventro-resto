<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj de Asistencia — Ventro Resto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2AB6A1;
            --bg-dark: #121526;
            --panel: #1A1D2E;
        }
        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .clock-container {
            background: var(--panel);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .pin-display {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            height: 70px;
            font-size: 2rem;
            letter-spacing: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            font-weight: bold;
            color: var(--primary);
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .key-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            height: 70px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            transition: all 0.2s;
            cursor: pointer;
        }
        .key-btn:hover {
            background: rgba(42, 182, 161, 0.2);
            border-color: var(--primary);
        }
        .key-btn:active {
            transform: scale(0.95);
        }
        .key-action {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.2);
        }
        .key-action:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        .btn-submit {
            background: linear-gradient(135deg, #2AB6A1, #1E8E7C);
            border: none;
            border-radius: 16px;
            height: 70px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            grid-column: span 3;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(42, 182, 161, 0.3);
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(42, 182, 161, 0.4);
        }
        #clock {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 5px;
            background: -webkit-linear-gradient(45deg, #fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #date {
            color: rgba(255,255,255,0.5);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <div id="clock">00:00:00</div>
        <div id="date">Lunes, 1 de Enero</div>

        <div th:if="${mensajeExito}" class="alert alert-success border-0" style="background:rgba(16,185,129,0.1); color:#34d399; border-radius:12px;">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensajeExito}"></span>
        </div>
        <div th:if="${mensajeError}" class="alert alert-danger border-0" style="background:rgba(239,68,68,0.1); color:#f87171; border-radius:12px;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensajeError}"></span>
        </div>

        <form th:action="@{/asistencia/reloj}" method="post" id="asistenciaForm">
            <input type="hidden" name="requestId" th:value="${requestId}">
            <input type="hidden" name="pin" id="pinInput">
            <div class="pin-display" id="pinDisplay">_ _ _ _</div>
            
            <div class="keypad">
                <button type="button" class="key-btn" onclick="addPin(1)">1</button>
                <button type="button" class="key-btn" onclick="addPin(2)">2</button>
                <button type="button" class="key-btn" onclick="addPin(3)">3</button>
                <button type="button" class="key-btn" onclick="addPin(4)">4</button>
                <button type="button" class="key-btn" onclick="addPin(5)">5</button>
                <button type="button" class="key-btn" onclick="addPin(6)">6</button>
                <button type="button" class="key-btn" onclick="addPin(7)">7</button>
                <button type="button" class="key-btn" onclick="addPin(8)">8</button>
                <button type="button" class="key-btn" onclick="addPin(9)">9</button>
                <button type="button" class="key-btn key-action" onclick="clearPin()"><i class="bi bi-x-lg"></i></button>
                <button type="button" class="key-btn" onclick="addPin(0)">0</button>
                <button type="button" class="key-btn key-action" style="color:#f59e0b; border-color:rgba(245,158,11,0.2); background:rgba(245,158,11,0.1)" onclick="delPin()"><i class="bi bi-backspace"></i></button>
                
                <button type="submit" class="btn-submit" id="btnSubmit" disabled>Registrar Asistencia</button>
            </div>
        </form>
    </div>

    <script>
        let pin = "";
        const maxLen = 6;

        function updateDisplay() {
            const display = document.getElementById('pinDisplay');
            if (pin.length === 0) {
                display.innerText = "_ _ _ _";
            } else {
                display.innerText = "• ".repeat(pin.length).trim();
            }
            
            document.getElementById('pinInput').value = pin;
            document.getElementById('btnSubmit').disabled = pin.length < 4;
        }

        function addPin(num) {
            if (pin.length < maxLen) {
                pin += num;
                updateDisplay();
            }
        }

        function clearPin() {
            pin = "";
            updateDisplay();
        }

        function delPin() {
            if (pin.length > 0) {
                pin = pin.slice(0, -1);
                updateDisplay();
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            document.getElementById('date').innerText = now.toLocaleDateString('es-ES', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'});
        }

        setInterval(updateClock, 1000);
        updateClock();

        // Autoclear alerts
        setTimeout(() => {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(a => a.style.display = 'none');
            clearPin();
        }, 4000);
    </script>
</body>
</html>
