<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{base :: header}"></head>
<body th:replace="~{base :: layout(~{::body/content()})}">
<style>
        :root {
            --primary: #2AB6A1; --primary-dark: #1E8E7C; --secondary: #2D3561;
            --sidebar-bg: #0F1117; --content-bg: #13161F; --card-bg: #1A1D2E;
            --border: rgba(255,255,255,0.07); --text-main: #E8EAF0;
            --text-muted: rgba(255,255,255,0.4); --sidebar-w: 260px;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--content-bg); color: var(--text-main); margin: 0; min-height: 100vh; }
        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 100; overflow-y: auto; }
        .sidebar-brand { padding: 1.75rem 1.5rem 1.25rem; border-bottom: 1px solid var(--border); }
        .sidebar-brand h2 { font-size: 1.15rem; font-weight: 700; color: #fff; margin: 0; }
        .sidebar-brand span { font-size: 0.72rem; color: var(--text-muted); }
        .nav-section-label { padding: 1.25rem 1.5rem 0.4rem; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }
        .nav-link-custom { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 1.5rem; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.9rem; font-weight: 500; border-left: 3px solid transparent; transition: all 0.18s; }
        .nav-link-custom:hover { color: #fff; background: rgba(42,182,161,0.08); border-left-color: var(--primary); }
        .nav-link-custom.activo { color: var(--primary); background: rgba(42,182,161,0.12); border-left-color: var(--primary); }
        .nav-link-custom i { font-size: 1.05rem; width: 20px; }
        .sidebar-user { margin-top: auto; padding: 1.25rem 1.5rem; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 0.75rem; }
        .user-avatar { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
        .user-name { font-size: 0.85rem; font-weight: 600; color: #fff; }
        .user-role { font-size: 0.72rem; color: var(--text-muted); }
        .btn-logout { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.25rem; transition: color 0.15s; margin-left: auto; }
        .btn-logout:hover { color: #ff7e7e; }
        .main-content { margin-left: var(--sidebar-w); min-height: 100vh; padding: 2rem 2.5rem; }
        .page-header h1 { font-size: 1.6rem; font-weight: 700; color: #fff; }
        .card-custom { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; }
        .table-custom { --bs-table-bg: transparent; --bs-table-color: var(--text-main); color: var(--text-main); border-color: var(--border); }
        .table-custom thead th { background: rgba(255,255,255,.04) !important; color: rgba(255,255,255,.5); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); }
        .table-custom tbody td { padding: 0.85rem 1rem; vertical-align: middle; border-bottom: 1px solid var(--border); background: transparent !important; color: var(--text-main); }
        .badge-entrada { background: rgba(110,231,180,0.15); color: #6ee7b4; padding: 0.3rem 0.6rem; border-radius: 6px; font-weight: 600; font-size: 0.72rem; }
        .badge-salida { background: rgba(255,126,126,0.15); color: #ff7e7e; padding: 0.3rem 0.6rem; border-radius: 6px; font-weight: 600; font-size: 0.72rem; }
    </style>
<main class="main-content">
    <div class="d-flex justify-content-between align-items-center page-header mb-4">
        <div>
            <h1 th:text="${titulo}">Historial de Movimientos</h1>
            <span style="color:var(--text-muted)">Registro cronológico detallado</span>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/insumos}" class="btn btn-outline-secondary" style="border-radius: 10px;">
                <i class="bi bi-arrow-left"></i> Volver a Inventario
            </a>
        </div>
    </div>

    <div class="card-custom">
        <table class="table table-custom">
            <thead>
                <tr>
                    <th>Fecha y Hora</th>
                    <th>Tipo</th>
                    <th>Cantidad</th>
                    <th>Usuario</th>
                    <th>Comentario / Justificación</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="mov : ${movimientos}">
                    <td class="text-nowrap" th:text="${#temporals.format(mov.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                    <td>
                        <span th:text="${mov.tipoMovimiento}" 
                              th:class="${mov.tipoMovimiento == 'ENTRADA'} ? 'badge-entrada' : 'badge-salida'">ENTRADA</span>
                    </td>
                    <td class="fw-bold" th:text="${mov.cantidad}">10</td>
                    <td th:text="${mov.usuario.username}">admin</td>
                    <td th:text="${mov.comentario != null ? mov.comentario : '—'}">Coment</td>
                </tr>
                <tr th:if="${#lists.isEmpty(movimientos)}">
                    <td colspan="5" class="text-center text-muted py-4">No hay movimientos registrados para este insumo.</td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
