<main th:fragment="content">
    <div class="p-2">
        <div th:if="${mensajeExito}" class="alert alert-success d-flex align-items-center mb-4 border-0" style="background: rgba(16,185,129,0.1); color: #10b981; border-radius: 12px; padding: 1rem;">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <div>
                <strong class="d-block mb-1">¡Éxito!</strong>
                <span th:text="${mensajeExito}"></span>
            </div>
        </div>

        <div th:if="${mensajeError}" class="alert alert-danger d-flex align-items-center mb-4 border-0" style="background: rgba(239,68,68,0.1); color: #ef4444; border-radius: 12px; padding: 1rem;">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <div>
                <strong class="d-block mb-1">Error</strong>
                <span th:text="${mensajeError}"></span>
            </div>
        </div>

        <div class="row">
            <div class="col-md-5 border-end border-secondary border-opacity-25 pe-4">
                <div class="text-center mb-4">
                    <div style="width: 80px; height: 80px; background: rgba(239,68,68,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                        <i class="bi bi-exclamation-octagon-fill" style="font-size: 2.5rem; color: #ef4444;"></i>
                    </div>
                    <h4 class="text-white fw-bold mb-1" th:text="${movimiento.insumo.nombre}">Tomate</h4>
                    <span class="badge" style="background: rgba(255,255,255,0.1); color: #A2A8BA; font-weight: normal; font-size: 0.85rem;" 
                          th:text="'Stock actual: ' + ${movimiento.insumo.stockActual} + ' ' + ${movimiento.insumo.unidadMedida}">Stock: 10 Kg</span>
                </div>
                
                <p class="text-white-50 small mb-0 mt-4 text-center">
                    El registro de mermas restará inmediatamente el inventario e impactará en los reportes de desperdicios del sistema.
                </p>
            </div>
            
            <div class="col-md-7 ps-4">
                <form id="formMerma" onsubmit="event.preventDefault(); registrarMermaAjax(this);">
                    <input type="hidden" name="insumo.id" th:value="${movimiento.insumo.id}">
                    <input type="hidden" name="tipoMovimiento" value="MERMA">
                    
                    <div class="mb-4">
                        <label class="form-label-sm" style="color: #ef4444; font-weight: 600; font-size: 0.8rem; text-transform: uppercase;">Cantidad Desperdiciada</label>
                        <div class="input-group mt-2">
                            <input type="number" step="0.01" name="cantidad" id="inputCantidadMerma" class="input-dark flex-grow-1 border-danger border-opacity-50" style="background: rgba(239,68,68,0.05); color: #fff; font-size: 1.2rem; padding: 0.8rem 1rem;" placeholder="0.00" required>
                            <span class="input-group-text border-0 bg-transparent fw-bold text-white-50" style="background: rgba(239,68,68,0.05) !important;" th:text="${movimiento.insumo.unidadMedida}">Kg</span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-sm" style="color: #A2A8BA; font-weight: 600; font-size: 0.8rem; text-transform: uppercase;">Motivo / Justificación</label>
                        <textarea name="comentario" id="inputComentarioMerma" class="input-dark w-100 mt-2" rows="3" style="background: rgba(255,255,255,0.05); color: #fff; resize: none; padding: 0.8rem 1rem;" placeholder="Ej: Producto en mal estado, vencido, dañado al manipular..." required></textarea>
                    </div>

                    <div class="text-end mt-4">
                        <button type="submit" class="btn" style="background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; border: none; padding: 0.8rem 2rem; border-radius: 12px; font-weight: 600; width: 100%;">
                            <i class="bi bi-exclamation-octagon-fill me-2"></i> Confirmar Merma
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
