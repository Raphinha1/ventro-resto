# =============================================
# Configuración de la Base de Datos PostgreSQL
# =============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# Configuración de JPA / Hibernate
# =============================================
# En producción usar 'validate' para evitar cambios accidentales
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.hbm2ddl.auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.flyway.baseline-version=1

# =============================================
# Configuración de Thymeleaf
# =============================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8

# =============================================
# Configuración de Seguridad y Actuator
# =============================================
# Exponer solo info y health por defecto
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =============================================
# Configuración General de la Aplicación
# =============================================
spring.application.name=restaurante
server.port=${PORT:8080}
server.servlet.session.timeout=24h

# En producción, forzar HTTPS si se usa un proxy (como Nginx)
server.forward-headers-strategy=native

# Configuración de subida de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${UPLOAD_DIR}
ventro.restaurant-id=${VENTRO_RESTAURANT_ID}
ventro.branch-id=${VENTRO_BRANCH_ID}
ventro.reservas.ventana-bloqueo-minutos=${VENTRO_RESERVAS_VENTANA_BLOQUEO_MINUTOS:30}
# Sin moneda configurada, recepción rechaza operaciones nuevas; no hay moneda por defecto.
ventro.inventory.currency=${VENTRO_INVENTORY_CURRENCY:}
